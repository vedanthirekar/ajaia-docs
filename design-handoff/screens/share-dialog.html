<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share dialog · Cotton theme</title>
<link rel="icon" href="../assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,500&amp;display=swap">
<style>
body{margin:0}
a{color:#2B2A3A}a:hover{color:#000}
</style>
</head>
<body>
<div style="width: 560px; height: 620px; box-sizing: border-box; padding: 40px; background: #EFE9DD; font-family: Inter, system-ui, sans-serif; color: #2B2A3A; font-size: 13px">
  <section role="dialog" aria-label="Share Q4 planning notes" style="background: #FFFDF8; border: 1.5px solid #2B2A3A; border-radius: 16px; box-shadow: 5px 5px 0 #CFE6F7; padding: 24px">
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <div>
        <h2 style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 24px">Share document</h2>
        <p style="margin: 4px 0 0; color: #6A6577">Q4 planning notes</p>
      </div>
      <button aria-label="Close" style="margin-left: auto; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #4A4657"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 20px">
      <label style="flex: 1; display: flex; align-items: center; height: 40px; padding: 0 12px; border: 1px solid #E2DACB; border-radius: 10px; background: #FFFFFF">
        <input placeholder="Add people by email" aria-label="Email address" style="flex: 1; min-width: 0; border: 0; font: inherit; color: #2B2A3A; outline: none">
        <span style="display: flex; align-items: center; gap: 4px; color: #4A4657; font-weight: 500">Editor<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
      </label>
      <button style="height: 40px; padding: 0 16px; border: 1.5px solid #2B2A3A; border-radius: 10px; background: #2B2A3A; color: #FFFFFF; font: 500 13px Inter, sans-serif">Invite</button>
    </div>

    <h3 style="margin: 22px 0 6px; font-size: 12px; font-weight: 600; color: #6A6577">People with access</h3>
    
      <div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid #F0EADF">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #CFE6F7; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">VH</span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-weight: 500">Vedant H. (you)</span>
          <span style="display: block; font-size: 12px; color: #6A6577">vedant@ajaia.app</span>
        </span>
        <span style="display: flex; align-items: center; gap: 4px; color: #4A4657">Owner</span>
      </div>
    
      <div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid #F0EADF">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #FFE7A3; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">BT</span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-weight: 500">Bob Tester</span>
          <span style="display: block; font-size: 12px; color: #6A6577">bob@ajaia.app</span>
        </span>
        <span style="display: flex; align-items: center; gap: 4px; color: #4A4657">Editor<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
      </div>
    
      <div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid #F0EADF">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #F7D3CF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">AC</span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-weight: 500">Alice Chen</span>
          <span style="display: block; font-size: 12px; color: #6A6577">alice@ajaia.app</span>
        </span>
        <span style="display: flex; align-items: center; gap: 4px; color: #4A4657">Viewer<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
      </div>
    

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px; border-radius: 12px; background: #FBF7EF">
      <span style="width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid #2B2A3A; background: #FFE7A3; display: flex; align-items: center; justify-content: center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2B2A3A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      </span>
      <span style="flex: 1">
        <span style="display: block; font-weight: 500">Restricted</span>
        <span style="display: block; font-size: 12px; color: #6A6577">Only people added above can open this</span>
      </span>
      <button style="height: 36px; padding: 0 14px; border: 1.5px solid #2B2A3A; border-radius: 10px; background: #FFFDF8; font: 500 13px Inter, sans-serif; color: #2B2A3A; display: flex; align-items: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Copy link
      </button>
    </div>
  </section>
</div>
</body>
</html>
